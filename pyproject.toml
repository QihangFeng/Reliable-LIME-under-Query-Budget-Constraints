[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reliable-lime"
version = "0.1.0"
description = "LIME image explanations and coarse-to-fine sampling under query budget constraints"
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE.txt"}
authors = [
    {name = "Qihang Feng"},
    {name = "Wonki Byun"},
    {name = "Zixi Chai"},
]
dependencies = [
    "numpy==1.24.4",
    "scipy==1.10.1",
    "scikit-learn==1.0.2",
    "scikit-image==0.21.0",
    "matplotlib==3.7.5",
    "pandas==2.0.3",
    "torch==2.2.2",
    "torchvision==0.17.2",
    "tqdm==4.67.3",
]

[project.urls]
Repository = "https://github.com/QihangFeng/Reliable-LIME-under-Query-Budget-Constraints"

[tool.setuptools.packages.find]
where = ["src"]
